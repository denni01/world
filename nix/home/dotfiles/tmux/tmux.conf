# tmux.
#
# Hyprland owns Super+1..9 for workspaces, so terminal tabs and splits live here
# rather than in Ghostty.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on

# Ghostty advertises truecolor; tell tmux so colours survive inside it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"

# Splits that keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane movement, matching the Hyprland bindings.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g status-style "bg=default fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M "
