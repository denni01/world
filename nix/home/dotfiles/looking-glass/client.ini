; Looking Glass client. The guest is modules/nixos/windows-vm.
;
; Escape key ungrabs the mouse; $mod+Escape (hypr/bindings.conf) suspends the
; rest of the keymap so Windows can see Super combinations.

[app]
shmFile=/dev/shm/looking-glass

[win]
title=win11
fullScreen=yes
quickSplash=yes

[input]
; Relative motion straight to the guest, no host acceleration applied twice.
rawMouse=yes
escapeKey=KEY_RIGHTCTRL

[spice]
enable=yes
audio=no
