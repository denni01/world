# Keybindings.
#
# SCOPE: this file owns WINDOW MANAGEMENT only. The macOS-style text bindings
# (Super+C/V/X/S/F/T/W/...) are handled in Phase 5 by xremap, which intercepts at
# the evdev layer BEFORE Hyprland sees the key. The two sets must stay disjoint —
# anything xremap claims will never reach a binding here.
#
# Deliberately carved out of xremap and reserved for Hyprland:
#   H J K L   focus movement. Cmd+H (hide) has no Linux analogue, and Cmd+L
#             (address bar) still works natively as Ctrl+L.
#   1-9 0     workspaces beat macOS's Cmd+1..9 tab switching, as requested.
#
# Conflicts resolved, with reasoning:
#   Super+Q       killactive (the requested Cmd+Q). Lock is Super+Ctrl+Q, which
#                 is macOS's actual Ctrl+Cmd+Q.
#   Super+F       left to xremap as "find". Fullscreen is Super+Ctrl+F — again
#                 what macOS actually uses.
#   Super+T       left to xremap as "new tab". Terminal is Super+Return (i3).
#   Screenshots   Cmd+Shift+3/4/5 is impossible: it collides with
#                 move-to-workspace-3/4/5. Using Print and Super+Shift+S.
#   Float toggle  Super+Shift+Space (i3 default), avoiding Cmd+T.
#   Super+P       given to xremap as Ctrl+P (VS Code quick-open). The `pseudo`
#                 dispatcher that used to live here is gone — dwindle:pseudotile
#                 was removed in 0.55.

$mod = SUPER
$term = ghostty
$menu = walker

# ── Applications ─────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $term
bind = $mod, SPACE, exec, $menu
bind = $mod, E, exec, nautilus
bind = $mod, Q, killactive
bind = $mod CTRL, Q, exec, hyprlock
bind = $mod SHIFT, E, exit

# ── Focus (i3 muscle memory) ─────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── Move windows ─────────────────────────────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Resize (held, no submap) ─────────────────────────────────────────────────
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, J, resizeactive, 0 40
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, L, resizeactive, 40 0

# ── Layout ───────────────────────────────────────────────────────────────────
bind = $mod, backslash, layoutmsg, togglesplit   # flip the current pair H <-> V
bind = $mod CTRL, F, fullscreen, 0       # macOS fullscreen chord
bind = $mod SHIFT, SPACE, togglefloating

# ── Workspaces ───────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, grave, workspace, previous

# ── Screenshots ──────────────────────────────────────────────────────────────
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m output --clipboard-only
bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mod SHIFT, C, exec, hyprpicker -a

# ── Clipboard history ────────────────────────────────────────────────────────
bind = $mod SHIFT, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy

# ── Media keys ───────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ── Mouse ────────────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
