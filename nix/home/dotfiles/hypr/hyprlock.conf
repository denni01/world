source = ~/.config/hypr/colors.conf

background {
    monitor =
    color = $bg
    blur_passes = 2
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}
