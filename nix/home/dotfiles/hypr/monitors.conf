# Single 4K display on the Raphael iGPU's HDMI output — desktop.nix pins the
# compositor there. Its DisplayPort input carries the passed-through 3090
# (modules/nixos/windows-vm) and is switched to by hand.
#
# Matched by description, not connector name: this panel has enumerated as both
# HDMI-A-1 and HDMI-A-2 across driver versions, and a stale name here is silently
# covered by the catch-all below rather than erroring.
# Confirm with: hyprctl monitors
#
# Scale 1.5 divides 3840x2160 into exactly 2560x1440. Hyprland rejects fractional
# scales that do not divide cleanly.
monitor = desc:Dell Inc. DELL S2721QS D0MFZY3, 3840x2160@60, 0x0, 1.5

# Fallback for any other output that gets plugged in.
monitor = , preferred, auto, 1.5
