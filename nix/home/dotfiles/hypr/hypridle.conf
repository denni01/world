general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

# Blanking must come after the lock, never before. A display that sleeps while
# the session is still unlocked looks locked but is not — anyone can wake it
# straight into the desktop. Keeping this later preserves "screen dark implies
# session locked".
listener {
    timeout = 3900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
