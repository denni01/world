# Window rules.
#
# Hyprland 0.53 overhauled this syntax: rules are now matcher-first with a
# `match:` prefix, and boolean rules take an explicit value.
#   old:  windowrulev2 = float, class:^(pavucontrol)$
#   new:  windowrule = match:class ^(pavucontrol)$, float on
# The old form is a fatal config error, which will refuse to start the session.
# Validate any change with:  Hyprland --verify-config -c ~/.config/hypr/hyprland.conf

windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:title ^(Open File|Save File|Save As)$, float on

# Screen-share picker from xdg-desktop-portal-hyprland.
windowrule = match:class ^(xdg-desktop-portal-hyprland)$, float on

# Only let a window hold off the idle timer when it is actually fullscreen.
windowrule = match:class .*, idle_inhibit fullscreen
