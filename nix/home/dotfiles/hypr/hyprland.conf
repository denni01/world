# Hyprland — entry point. Plain file, symlinked from the repo, so edits apply on
# `hyprctl reload` without a nixos-rebuild.
#
# ALWAYS validate before rebooting — a fatal config error makes Hyprland exit at
# startup, and the greeter bounces you back with the message visible for about
# half a second:
#
#     Hyprland --verify-config
#
# Syntax moves between releases. This config targets 0.55: window rules are
# matcher-first (`windowrule = match:class ^(x)$, float on`), split toggling is
# `layoutmsg, togglesplit`, and dwindle has no `pseudotile` option.

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/windowrules.conf

# ── Autostart ────────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --watch cliphist store

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── Layout ───────────────────────────────────────────────────────────────────
# dwindle with preserve_split is the closest thing to i3 without a plugin: a
# workspace usually holds one window, and Super+\ flips the split orientation of
# the current pair when you want two.
dwindle {
    preserve_split = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $inactive
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease
    animation = fade, 1, 3, ease
    # Workspace switching is instant — no slide. Animations are not required by
    # Hyprland at all; `enabled = false` above would turn off every one of them.
    animation = workspaces, 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Follow activation requests. Single-instance apps (Chromium, Ghostty with
    # --gtk-single-instance) do not open a second window when launched again —
    # they signal the running process to raise its existing one. Without this,
    # launching an app that is already open on another workspace looks like the
    # launcher silently did nothing. With it, focus jumps to wherever it lives.
    focus_on_activate = true
}

# XWayland apps render blurry under a fractional scale unless they are handed an
# unscaled surface and allowed to scale themselves.
xwayland {
    force_zero_scaling = true
}

# ── Debug ────────────────────────────────────────────────────────────────────
# Hyprland disables stdout logging by default, which is why the aquamarine
# failure detail went to a runtime logfile that vanished on reboot instead of to
# the journal. Under uwsm, stdout lands in `journalctl --user -u wayland-wm@*`.
# Keep this on until the desktop is stable, then drop it — it is noisy.
debug {
    disable_logs = false
}
